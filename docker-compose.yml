services:
  postgres:
    image: postgres:16-alpine
    container_name: gakko-postgres
    environment:
      POSTGRES_DB: Gakko
      POSTGRES_USER: gakko_admin
      POSTGRES_PASSWORD: gakko
      TZ: Europe/Warsaw
    ports:
      - "5432:5432"
    volumes:
      # W wersji 16 wracamy do standardowej, bezproblemowej ścieżki montowania danych
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: