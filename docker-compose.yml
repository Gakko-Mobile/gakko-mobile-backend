services:

  postgres:
    image: postgres:16-alpine
    container_name: gakko-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: Gakko
      POSTGRES_USER: gakko_admin
      POSTGRES_PASSWORD: gakko
      TZ: Europe/Warsaw

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data


  kafka:
    image: apache/kafka:4.3.1
    container_name: gakko-kafka
    restart: unless-stopped

    ports:
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      # kafka:9092      -> Docker network
      # localhost:29092 -> host machine
      # kafka:29093     -> KRaft controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        PLAINTEXT_HOST://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"


  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    container_name: gakko-schema-registry
    restart: unless-stopped
    platform: linux/amd64

    depends_on:
      - kafka

    ports:
      - "8081:8081"

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"

      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"


  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: gakko-kafka-ui
    restart: unless-stopped

    depends_on:
      - kafka
      - schema-registry

    ports:
      - "7070:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: gakko-cluster

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081


volumes:
  pgdata:
