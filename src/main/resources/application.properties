spring.application.name=gakko-backend
server.port=8080
# Database settings

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.url=jdbc:postgresql://localhost:5432/Gakko
spring.datasource.username=gakko_admin
spring.datasource.password=gakko
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Security settings

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 15 minutes
application.security.jwt.expiration=900000
# 7 days
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.cleanup.cron=0 0 * * * *

# Kafka settings

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.schema-registry-url=http://localhost:8081

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.consumer.group-id=gakko-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

kafka.topic.notifications=gakko.notifications

# Springdoc settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method